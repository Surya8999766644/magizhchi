
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Driven Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: white;
            width: 320px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .calculate {
            background-color: #2563eb;
        }

        .reset {
            background-color: #dc2626;
        }

        #result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #15803d;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Calculator</h2>

        <form id="calculatorForm">
            <label for="num1">First Number</label>
            <input type="number" id="num1" step="any"
                   placeholder="Enter first number" required>

            <label for="num2">Second Number</label>
            <input type="number" id="num2" step="any"
                   placeholder="Enter second number" required>

            <label for="operation">Select Operation</label>
            <select id="operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (*)</option>
                <option value="divide">Division (/)</option>
                <option value="modulus">Modulus (%)</option>
            </select>

            <button type="submit" class="calculate">
                Calculate
            </button>

            <button type="reset" class="reset">
                Reset
            </button>
        </form>

        <p id="result">Result will appear here</p>
    </div>

    <script>
        const form = document.getElementById("calculatorForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const a = Number(document.getElementById("num1").value);
            const b = Number(document.getElementById("num2").value);
            const operation = document.getElementById("operation").value;

            let result;

            switch (operation) {
                case "add":
                    result = a + b;
                    break;

                case "subtract":
                    result = a - b;
                    break;

                case "multiply":
                    result = a * b;
                    break;

                case "divide":
                    if (b === 0) {
                        document.getElementById("result").textContent =
                            "Cannot divide by zero!";
                        return;
                    }
                    result = a / b;
                    break;

                case "modulus":
                    if (b === 0) {
                        document.getElementById("result").textContent =
                            "Cannot calculate modulus with zero!";
                        return;
                    }
                    result = a % b;
                    break;
            }

            document.getElementById("result").textContent =
                "Result: " + result;
        });

        form.addEventListener("reset", function() {
            document.getElementById("result").textContent =
                "Result will appear here";
        });
    </script>

</body>
</html>
