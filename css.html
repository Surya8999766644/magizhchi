
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f0f0;
        }

        .box {
            width: 500px;
            height: 500px;
            padding: 20px;
            border: 5px solid green;
            margin: 30px auto;
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        This is a Div Box
    </div>

</body>
</html>
